<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;}
html,body{width:100%;height:100%;overflow:hidden;}
body{display:flex;align-items:center;justify-content:space-between;padding:0 7%;
  background:linear-gradient(135deg,#D9B25A 0%,#B5862B 50%,#8A6520 100%);color:#fff;}
.left{max-width:62%;}
.brand{display:flex;align-items:center;gap:22px;margin-bottom:26px;}
.brand img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 26px rgba(0,0,0,.28);}
.brand .name{font-size:62px;font-weight:900;letter-spacing:-1px;text-shadow:0 3px 12px rgba(0,0,0,.18);}
.tag{font-size:33px;font-weight:700;line-height:1.25;text-shadow:0 2px 8px rgba(0,0,0,.18);}
.feats{margin-top:28px;display:flex;gap:14px;flex-wrap:wrap;}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;
  padding:11px 20px;font-size:21px;font-weight:700;backdrop-filter:blur(4px);}
.phone{width:240px;height:430px;background:#0E0E12;border-radius:42px;padding:7px;
  box-shadow:0 26px 60px rgba(0,0,0,.4);transform:rotate(6deg);}
.scr{width:100%;height:100%;border-radius:36px;background:#F4F4F7;overflow:hidden;}
.scr .hd{height:120px;background:linear-gradient(140deg,#B5862B,#8A6520);padding:20px;color:#fff;}
.scr .hd b{font-size:26px;font-weight:900;}
.scr .sr{background:#fff;border-radius:14px;height:34px;margin-top:14px;}
.scr .cd{margin:16px;height:120px;border-radius:18px;background:linear-gradient(135deg,#3B7DD8,#1B3A6B);}
.scr .cd2{margin:16px;height:120px;border-radius:18px;background:linear-gradient(135deg,#C16B8E,#7B2E52);}
</style></head><body>
<div class="left">
  <div class="brand"><img src="../../assets/icon.png"><div class="name">Altın100</div></div>
  <div class="tag">Berber &amp; güzellik randevun cebinde</div>
  <div class="feats"><span class="chip">📍 Yakınındakiler</span><span class="chip">⏱️ Hızlı randevu</span><span class="chip">★ Gerçek yorumlar</span></div>
</div>
<div class="phone"><div class="scr"><div class="hd"><b>Altın100</b><div class="sr"></div></div><div class="cd"></div><div class="cd2"></div></div></div>
</body></html>
