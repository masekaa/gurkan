<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İyiKiRandevu</title>
<meta name="description" content="İyiKiRandevu — randevunu saniyeler içinde al. Uygulamayı indir.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(circle at 50% 0%,#E8C15A 0%,#D9A521 45%,#B8871C 100%);
    color:#241A05;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:760px;background:#fff;border-radius:28px;padding:40px 28px;
    box-shadow:0 24px 60px rgba(0,0,0,.22);text-align:center}
  .logo{width:120px;height:120px;border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.15);margin:0 auto 18px}
  h1{font-size:30px;color:#1B1B22;letter-spacing:.3px}
  .tagline{margin-top:14px;font-size:26px;font-weight:800;color:#1B1B22;letter-spacing:.3px}
  .sub{margin-top:6px;color:#6C6C77;font-size:16px}
  .qrs{display:flex;gap:20px;margin-top:32px;flex-wrap:wrap;justify-content:center}
  .qr{flex:1 1 260px;max-width:320px;border:1px solid #E4E4EA;border-radius:20px;padding:22px;
    display:flex;flex-direction:column;align-items:center;gap:14px;text-decoration:none;color:inherit;
    transition:transform .15s ease,box-shadow .15s ease}
  .qr:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.12)}
  .qrbox{width:200px;height:200px}
  .store{font-size:13px;color:#6C6C77;text-transform:uppercase;letter-spacing:1px}
  .name{font-size:18px;font-weight:700;color:#1B1B22}
  .hint{margin-top:26px;color:#8A6520;font-size:14px}
  @media(prefers-color-scheme:dark){
    .card{background:#15151A}
    h1,.name{color:#F4F4F7}.sub,.store{color:#A6A6B0}.tagline{color:#F4F4F7}
    .qr{border-color:#2A2A31}
    .qrbox svg path{fill:#F4F4F7 !important}
  }
</style>
